<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Crosslinks Host Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#18202F; --muted:#556073; --line:#D3D9E4;
  --accent:#1D6B88; --accent-ink:#FFFFFF; --ok:#1C7F52; --bad:#B8323F;
  --display:"Familjen Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141E; --surface:#171F2D; --ink:#E7ECF4; --muted:#9BA6BA; --line:#283347;
  --accent:#6CC3DE; --accent-ink:#0B1820; --ok:#4FD18F; --bad:#FF7A88; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141E; --surface:#171F2D; --ink:#E7ECF4; --muted:#9BA6BA; --line:#283347;
  --accent:#6CC3DE; --accent-ink:#0B1820; --ok:#4FD18F; --bad:#FF7A88; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding-block:40px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0}
h1{font-size:2.2rem;line-height:1}
h2{font-size:1.15rem}
p{margin:0}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.note{color:var(--muted);font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{flex:1 1 200px;min-width:0;font-size:1.05rem;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.key{margin:0;padding-left:1.4em}
.result{font-weight:700;min-height:1.4em}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
a{color:var(--accent)}
</style>
</head>
<body>
<main class="wrap">
  <div class="row" style="justify-content:space-between;align-items:baseline">
    <h1>Host tools</h1>
    <a href="./">Back to the game</a>
  </div>
  <p class="note">Players, no peeking. This page holds the answers.</p>

  <section class="card">
    <h2>Check a finish code</h2>
    <p class="note">The code also tells you the team's time, with hint penalties included.</p>
    <div class="row">
      <input id="chkTeam" class="field" placeholder="Team name" autocomplete="off">
      <input id="chkCode" class="field" placeholder="Code" autocomplete="off" style="flex-basis:110px">
    </div>
    <div><button class="btn" type="button" id="chkBtn">Check code</button></div>
    <div class="result" id="chkResult" role="status"></div>
  </section>

  <section class="card">
    <h2>Answer key</h2>
    <div><button class="btn ghost" type="button" id="keyBtn">Show answers</button></div>
    <ol class="key" id="key" hidden></ol>
  </section>

  <section class="card">
    <h2>This device</h2>
    <p class="note">Clears the team name, timer and progress saved in this browser.</p>
    <div class="row" id="resetArea"></div>
  </section>
</main>

<script>
(function(){
  // Must match the values in index.html.
  var ANS={1:["NQ==",true],2:["SUdOVUY=",1],3:["UkFUUw==",3],4:["NQ==",true],5:["WUtT",1],6:["Q0lUTkFMVEE=",0]};
  var META="QUtFUlVF", KEY="crosslinks:v1", ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", SALT="crosslinks-demo";
  var dec=function(s){return atob(s).split("").reverse().join("")};
  var norm=function(v){return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"")};
  var normTeam=function(t){return String(t||"").trim().toLowerCase().replace(/\s+/g," ")};
  var $=function(id){return document.getElementById(id)};
  function fmt(ms){var t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
    return (h?h+":"+(m<10?"0":"")+m:m)+":"+(s<10?"0":"")+s}
  function hash(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
    var out="";for(var j=0;j<5;j++){out+=ALPH[h%32];h=Math.floor(h/32)}return out}
  function codeFor(team,secs){return hash(normTeam(team)+"|"+secs+"|"+SALT)}

  $("chkBtn").addEventListener("click",function(){
    var t=$("chkTeam").value,c=norm($("chkCode").value),r=$("chkResult");
    if(!normTeam(t)||!c){r.className="result bad";r.textContent="Enter both the team name and the code.";return}
    for(var s=0;s<=6*3600;s++){if(codeFor(t,s)===c){r.className="result ok";r.textContent="Valid. "+t.trim()+" finished in "+fmt(s*1000)+", hint penalties included.";return}}
    r.className="result bad";r.textContent="That code doesn't match. Check the team name is spelled exactly as they entered it.";
  });

  $("keyBtn").addEventListener("click",function(){
    var k=$("key");
    if(k.hidden){k.innerHTML="";
      for(var n=1;n<=6;n++){var a=dec(ANS[n][0]),num=ANS[n][1]===true,li=document.createElement("li");
        li.textContent=a+(num?" (letter "+String.fromCharCode(64+parseInt(a,10))+")":"");k.appendChild(li)}
      var li=document.createElement("li");li.value=7;li.textContent="Final: "+dec(META);k.appendChild(li);
      k.hidden=false;this.textContent="Hide answers"}
    else{k.hidden=true;this.textContent="Show answers"}
  });

  function resetArea(msg){
    var a=$("resetArea");a.innerHTML="";
    var b=document.createElement("button");b.className="btn ghost";b.type="button";b.textContent="Clear progress on this device";
    b.addEventListener("click",function(){
      a.innerHTML="";a.appendChild(document.createTextNode("Clear this device's team, timer and answers? "));
      var y=document.createElement("button");y.className="btn";y.type="button";y.textContent="Yes, clear it";
      var n=document.createElement("button");n.className="linkish";n.type="button";n.textContent="Cancel";
      y.addEventListener("click",function(){try{localStorage.removeItem(KEY)}catch(e){}resetArea("Cleared. The game will start fresh on this device.")});
      n.addEventListener("click",function(){resetArea()});
      a.appendChild(y);a.appendChild(n);y.focus();
    });
    a.appendChild(b);
    if(msg){var p=document.createElement("span");p.className="result ok";p.setAttribute("role","status");p.textContent=msg;a.appendChild(p)}
  }
  resetArea();
})();
</script>
</body>
</html>
